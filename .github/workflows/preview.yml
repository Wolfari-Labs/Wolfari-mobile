name: Android preview

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Mobile CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       vars.ENABLE_PREVIEW_BUILDS == 'true')
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}

  build:
    name: Build Android APK
    needs: verify
    # Release credentials are only available on the protected main branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: preview
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Always build the exact commit whose checks passed.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Check build configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: node scripts/check-preview-config.mjs
      - run: npm ci
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Verify the Expo preview environment
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          WOLFARI_EXPECTED_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: npx eas-cli@latest env:exec --environment preview "node scripts/check-preview-config.mjs"
      - name: Build and wait for the APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EAS_BUILD_NO_EXPO_GO_WARNING: '1'
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait
